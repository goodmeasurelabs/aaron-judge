name: Manually release reviewed Aaron PR4
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect only, or publish the exact reviewed PR4 source before merge
        type: choice
        options: [inspect, deploy-reviewed-pr4]
        default: inspect
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
env:
  NEXT_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'
  WRANGLER_LOG_SANITIZE: 'true'
  NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
jobs:
  reviewed-pr4-release:
    if: github.repository == 'goodmeasurelabs/aaron-judge' && github.ref == 'refs/heads/codex/aaron-pr4-manual-release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-production
    defaults:
      run:
        working-directory: candidate
    steps:
      - name: Check out the exact temporary harness revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - name: Check out only the exact reviewed PR4 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a1e4696b8561d62edea37c90d2becc5ca38facd0
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prove the reviewed PR4 head and unchanged approved main base
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ../harness/scripts/manual-pr4-proof.mjs initial
      - name: Require existing public analytics configuration
        run: test -n "$NEXT_PUBLIC_GA_MEASUREMENT_ID"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: node --test scripts/verify-worker-release.test.mjs
      - run: npx --no-install opennextjs-cloudflare build
      - name: Dry-run the exact explicit-config deployment command
        run: npx --no-install wrangler deploy --config wrangler.jsonc --keep-vars --message="GitHub commit a1e4696b8561d62edea37c90d2becc5ca38facd0" --dry-run --outdir .worker-dry-run
      - name: Recheck PR4/main proof and capture existing Worker metadata
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: node ../harness/scripts/manual-pr4-state.mjs
      - name: Publish only the explicitly reviewed PR4 source
        if: inputs.operation == 'deploy-reviewed-pr4'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          workingDirectory: candidate
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          accountId: ee641897681cddb2b23b18fb4b639034
          wranglerVersion: '4.147.0'
          command: deploy --config wrangler.jsonc --keep-vars --message="GitHub commit a1e4696b8561d62edea37c90d2becc5ca38facd0"
      - name: Verify reviewed source annotation and preserved bindings
        if: inputs.operation == 'deploy-reviewed-pr4'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: node ../harness/scripts/manual-pr4-state.mjs --after
      - name: Retain explicit source context and sanitized before/after metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-aaron-pr4-release-${{ github.run_id }}
          path: candidate/release-evidence/
          if-no-files-found: error
          retention-days: 30
